apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
  namespace: roboshop
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    component: catalogue
    tier: db
spec:
  replicas: "{{.Values.deployment.replicas}}"
  selector:
    matchLabels:
      project: roboshop
      component: catalogue
      tier: db
  template:
    metadata:
      labels: 
        project: roboshop
        component: catalogue
        tier: db
    spec:
      containers:
      - name: catalogue
        image: "{{ .Values.deployment.image}}:{{ .Values.deployment.imageVersion }}"
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: catalogue
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          failureThreshold: 1
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 3
          failureThreshold: 1

